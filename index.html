<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家事洗碗紀錄 APP</title>
  
  <!-- ==================== PWA 設定 (新增) ==================== -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3073/3073992.png">

  <!-- Tailwind CSS & Vue 3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 sm:p-6">

  <div id="app" class="max-w-md mx-auto space-y-4">
    
    <!-- 標題卡片 -->
    <header class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 text-center">
      <h1 class="text-xl font-bold text-slate-900">🍽️ 兩人洗碗分工紀錄</h1>
      <p class="text-xs text-slate-500 mt-1">本地離線暫存版（資料存於本機）</p>
    </header>

    <!-- 下一位預設輪次提醒 -->
    <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-center">
      <span class="text-xs font-semibold text-blue-600 uppercase tracking-wider block mb-1">系統建議輪次</span>
      <p class="text-lg font-bold text-blue-900">
        預計輪到：<span class="text-blue-600 underline">{{ suggestedWasher }}</span>
      </p>
    </div>

    <!-- 登記表單卡片 -->
    <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
      <h2 class="text-base font-bold text-slate-900 border-b pb-2">➕ 新增洗碗紀錄</h2>
      
      <form @submit.prevent="addRecord" class="space-y-3">
        <!-- 日期與時段 -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">日期</label>
            <input type="date" v-model="form.date" required
                   class="w-full text-sm p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">時段</label>
            <select v-model="form.timeSlot" required
                    class="w-full text-sm p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="早餐">早餐 (上午)</option>
              <option value="午餐">午餐 (中午)</option>
              <option value="晚餐">晚餐 (晚上)</option>
            </select>
          </div>
        </div>

        <!-- 洗碗人選單 -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">洗碗人</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" 
                    @click="form.washer = '成員 A'"
                    :class="form.washer === '成員 A' ? 'bg-blue-600 text-white font-bold' : 'bg-slate-100 text-slate-600'"
                    class="py-2 text-sm rounded-lg border transition-all">
              成員 A
            </button>
            <button type="button" 
                    @click="form.washer = '成員 B'"
                    :class="form.washer === '成員 B' ? 'bg-blue-600 text-white font-bold' : 'bg-slate-100 text-slate-600'"
                    class="py-2 text-sm rounded-lg border transition-all">
              成員 B
            </button>
          </div>
        </div>

        <!-- 備註輸入框 -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">備註 (可選)</label>
          <input type="text" v-model="form.note" placeholder="例如：煮飯者抵銷、包含清大鍋"
                 class="w-full text-sm p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-2.5 rounded-xl transition-all shadow-md shadow-blue-200">
          確認登記
        </button>
      </form>
    </section>

    <!-- 歷史紀錄列表 -->
    <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="text-base font-bold text-slate-900">📜 歷史洗碗登記</h2>
        <span class="text-xs text-slate-400">共 {{ records.length }} 筆</span>
      </div>

      <div v-if="records.length === 0" class="text-center py-6 text-xs text-slate-400">
        目前尚無登記資料，趕快完成第一次洗碗吧！
      </div>

      <div class="space-y-2 max-h-80 overflow-y-auto pr-1">
        <div v-for="(item, index) in records" :key="index" 
             class="flex justify-between items-center p-3 bg-slate-50 border border-slate-100 rounded-xl">
          <div class="space-y-0.5">
            <div class="flex items-center space-x-2">
              <span class="text-xs font-bold text-slate-700">{{ item.date }}</span>
              <span class="text-[10px] px-1.5 py-0.5 bg-slate-200 text-slate-600 rounded">{{ item.timeSlot }}</span>
            </div>
            <p class="text-sm font-semibold text-blue-900">洗碗人：{{ item.washer }}</p>
            <p v-if="item.note" class="text-xs text-slate-400">💬 {{ item.note }}</p>
          </div>
          <button @click="deleteRecord(index)" class="text-xs text-red-400 hover:text-red-600 px-2 py-1">
            刪除
          </button>
        </div>
      </div>
    </section>

  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
      setup() {
        const records = ref([]);
        const form = ref({
          date: '',
          timeSlot: '晚餐',
          washer: '成員 A',
          note: ''
        });

        // 讀取 localStorage
        const loadRecords = () => {
          const saved = localStorage.getItem('dish_records_local');
          if (saved) {
            try {
              records.value = JSON.parse(saved);
            } catch (e) {
              records.value = [];
            }
          }
        };

        // 儲存至 localStorage
        const saveToLocal = () => {
          localStorage.setItem('dish_records_local', JSON.stringify(records.value));
        };

        // 自動推算建議洗碗人（基於上一筆紀錄自動對調）
        const suggestedWasher = computed(() => {
          if (records.value.length === 0) return '成員 A';
          const lastWasher = records.value[0].washer;
          return lastWasher === '成員 A' ? '成員 B' : '成員 A';
        });

        // 自動推算時段與預設日期
        const initForm = () => {
          const now = new Date();
          const year = now.getFullYear();
          const month = String(now.getMonth() + 1).padStart(2, '0');
          const day = String(now.getDate()).padStart(2, '0');
          form.value.date = `${year}-${month}-${day}`;

          const hours = now.getHours();
          if (hours < 11) form.value.timeSlot = '早餐';
          else if (hours < 16) form.value.timeSlot = '午餐';
          else form.value.timeSlot = '晚餐';

          form.value.washer = suggestedWasher.value;
        };

        // 新增紀錄
        const addRecord = () => {
          records.value.unshift({
            date: form.value.date,
            timeSlot: form.value.timeSlot,
            washer: form.value.washer,
            note: form.value.note
          });
          saveToLocal();
          form.value.note = '';
          // 更新下一位預設選擇
          form.value.washer = suggestedWasher.value;
        };

        // 刪除紀錄
        const deleteRecord = (index) => {
          if (confirm('確定要刪除這筆紀錄嗎？')) {
            records.value.splice(index, 1);
            saveToLocal();
            form.value.washer = suggestedWasher.value;
          }
        };

        onMounted(() => {
          loadRecords();
          initForm();
        });

        return {
          records,
          form,
          suggestedWasher,
          addRecord,
          deleteRecord
        };
      }
    }).mount('#app');

    // ==================== PWA Service Worker 註冊 (新增) ====================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA Service Worker 已成功啟動'))
          .catch(err => console.error('PWA 註冊失敗', err));
      });
    }
  </script>
</body>
</html>
